<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartClass Vision AI - Secure Institutional Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/role_dashboard.css">
  <style>
    :root {
      --primary: #0F172A;
      --secondary: #2563EB;
      --secondary-hover: #1D4ED8;
      --secondary-subtle: #EFF6FF;
      --bg-app: #F8FAFC;
      --border-color: #E2E8F0;
      --font-heading: 'Plus Jakarta Sans', var(--font-body);
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-app);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.05) 0%, transparent 45%),
        linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.05),
        0 20px 40px -12px rgba(15, 23, 42, 0.10);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .login-header {
      padding: 2.25rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, #FFFFFF 0%, #FAFCFF 100%);
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: #FFFFFF;
      padding: 6px;
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }

    .institutional-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-header h1 {
      font-family: var(--font-heading);
      font-size: 1.38rem;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.025em;
      line-height: 1.25;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .badge-vision {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--secondary);
      color: #FFFFFF;
    }

    .login-header p {
      font-size: 0.82rem;
      color: #64748B;
      margin-top: 0.4rem;
      font-weight: 500;
    }

    .login-body {
      padding: 2rem;
    }

    .alert-box {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-error {
      background: #FEF2F2;
      color: #B91C1C;
      border: 1px solid #FECACA;
    }

    .alert-success {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.80rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: #94A3B8;
      pointer-events: none;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-control {
      width: 100%;
      padding: 0.70rem 0.85rem 0.70rem 2.4rem;
      font-size: 0.90rem;
      color: #0F172A;
      background-color: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.18s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .preset-selector-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      margin-bottom: 0.4rem;
    }

    .preset-btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.35rem;
    }

    .preset-role-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.55rem 0.75rem;
      font-size: 0.80rem;
      font-weight: 600;
      color: #475569;
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-role-btn:hover {
      background: #FFFFFF;
      color: var(--secondary);
      border-color: #CBD5E1;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #FFFFFF;
      background: var(--secondary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-btn:hover {
      background: var(--secondary-hover);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer-info {
      margin-top: 1.5rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .security-notice {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #059669;
      margin-bottom: 0.3rem;
    }

    .role-policy-text {
      font-size: 0.72rem;
      color: #64748B;
      line-height: 1.4;
    }

    .role-policy-text strong {
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="logo-container">
        <img src="/static/img/smartclass_logo.png" alt="SmartClass Vision AI Crest" class="institutional-logo-img">
      </div>
      <h1>
        SmartClass
        <span class="badge-vision">Vision AI</span>
      </h1>
      <p>Secure Portal Login & Institutional Smart Board Attendance</p>
      <!-- SmartClass Vision AI - Smart Board Live Portal | Supported: CAMERA SOURCE | PC CAMERA | DROIDCAM | EXTENSION | ESP32 CAMERA -->
    </div>

    <div class="login-body">
      <div id="alertBox" class="alert-box alert-error"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="userId">User ID / Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="userId" 
              class="form-control" 
              placeholder="e.g. HOD001, FAC001, ADV001" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
          </div>
        </div>

        <div>
          <div class="preset-selector-label">Quick Role Credentials</div>
          <div class="preset-btn-row">
            <button type="button" class="preset-role-btn" onclick="selectRolePreset('HOD001')">
              🏛️ <span>HOD</span>
            </button>
            <button type="button" class="preset-role-btn" onclick="selectRolePreset('FAC001')">
              👨‍🏫 <span>Faculty</span>
            </button>
            <button type="button" class="preset-role-btn" onclick="selectRolePreset('ADV001')">
              👥 <span>Advisor</span>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="login-btn">
          <span>Sign In to Portal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer-info">
        <div class="security-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Enterprise Role-Based Access Control
        </div>
        <div class="role-policy-text">
          <strong>HOD:</strong> Full System Administration & Monitoring<br>
          <strong>Faculty:</strong> Instructional Classroom & Real-time Attendance<br>
          <strong>Class Advisor:</strong> Assigned Classroom & Student Verification
        </div>
      </div>
    </div>
  </div>

  <script>
    function selectRolePreset(userId) {
      const input = document.getElementById("userId");
      input.value = userId;
      document.getElementById("password").focus();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById("alertBox");
      const submitBtn = document.getElementById("submitBtn");
      alertBox.style.display = "none";
      alertBox.className = "alert-box alert-error";

      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value;

      if (!userId || !password) {
        alertBox.innerText = "Please enter both User ID and password.";
        alertBox.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Signing in...</span>`;

      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, password: password })
        });

        const data = await resp.json();

        if (resp.ok && data.success) {
          const authData = data.data;
          localStorage.setItem("smartclass_token", authData.access_token);
          localStorage.setItem("smartclass_user", JSON.stringify(authData.user));

          alertBox.className = "alert-box alert-success";
          alertBox.innerText = `Welcome, ${authData.user.name}! Redirecting...`;
          alertBox.style.display = "block";

          setTimeout(() => {
            window.location.href = authData.redirect_url;
          }, 350);
        } else {
          alertBox.innerText = data.error?.message || data.detail || "Authentication failed. Please check your credentials.";
          alertBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Sign In to Portal</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
        }
      } catch (err) {
        console.error("Login request error:", err);
        alertBox.innerText = "Unable to connect to server. Please ensure backend is running.";
        alertBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In to Portal</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
      }
    }
  </script>

</body>
</html>
