<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="scBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="scCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="scGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="scNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield / Smart Board Perimeter -->
  <polygon points="50,6 88,22 88,68 50,94 12,68 12,22" 
           fill="url(#scCoreGrad)" 
           stroke="url(#scBorderGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"/>

  <!-- Smart Board Interior Screen Frame -->
  <rect x="26" y="24" width="48" height="34" rx="4" 
        fill="#070D19" 
        stroke="#1E293B" 
        stroke-width="1.5"/>

  <!-- AI Bounding Target Brackets (Computer Vision Crosshairs) -->
  <path d="M 30,30 L 30,26 L 34,26" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 70,30 L 70,26 L 66,26" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 30,52 L 30,56 L 34,56" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 70,52 L 70,56 L 66,56" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

  <!-- Camera Vision Aperture / Optical Lens Outer Ring -->
  <circle cx="50" cy="41" r="10" 
          stroke="url(#scBorderGrad)" 
          stroke-width="2" 
          fill="#0B1220"/>

  <!-- Iris Core / Pupil Node -->
  <circle cx="50" cy="41" r="4.5" 
          fill="#06B6D4" 
          filter="url(#scNeonGlow)"/>
  <circle cx="48.5" cy="39.5" r="1.5" fill="#FFFFFF"/>

  <!-- Neural Network Lattice Nodes & Connecting Vectors -->
  <line x1="26" y1="41" x2="38" y2="41" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="62" y1="41" x2="74" y2="41" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Lower Pedestal / Smart Board Mount & Secure Anchor Nodes -->
  <path d="M 38,70 L 50,78 L 62,70" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="70" r="2.5" fill="#06B6D4"/>
  <circle cx="50" cy="78" r="3" fill="#2563EB"/>
  <circle cx="62" cy="70" r="2.5" fill="#06B6D4"/>

  <!-- Bottom Apex Beacon -->
  <circle cx="50" cy="87" r="1.5" fill="#38BDF8"/>
</svg>
